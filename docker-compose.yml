services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nvhacking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nvhacking}
      POSTGRES_DB: ${POSTGRES_DB:-nvhacking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nvhacking}']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3001'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nvhacking}:${POSTGRES_PASSWORD:-nvhacking}@db:5432/${POSTGRES_DB:-nvhacking}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-in-production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
